<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trello Clone</title>
    <link rel="stylesheet" href="flex6.css">
</head>
<body>
    <header class="navbar">
        <div class="logo-container">
            <span class="atlassian">ATLASSIAN</span>
            <div class="brand">
                <div class="Trello-icons"></div>
                <h1>Trello</h1>
            </div>
        </div>
        <nav class="nav-links">
            <a href="#" class="menu-items">featues <span class="arrow">v</span></a>
            <a href="#" class="menu-items">solution <span class="arrow">v</span></a>
            <a href="#" class="menu-items">plans <span class="arrow">v</span></a>
            <a href="#" class="menu-items">pricing <span class="arrow">v</span></a>
            <a href="#" class="menu-items">resources <span class="arrow">v</span></a>
        </nav>
        <div class="nav-actions">
            <a href="#" class="login-btn">Log in</a>
            <a href="#" class="get-ed-btn">Get Trello for free</a>
        </div>
    </header>

    <main class="hero-section">
        <div class="hero-content">
            <h2>Trello brings all your task, teammates and tools together</h2>
            <p>Keep everything in the same place-even if your team isn't.</p>

            <div class="signup-form">
                <input type="email" placeholder="Email" class="email-input">
                <button class="submit-btn">sign up - it's free</button>
            </div>
        </div>

        <div class="hero-image">
            <div class="illustration-box">
                <div class="card-column">
                    <div class="card-item"></div>
                    <div class="card-item"></div>
                </div>
                <div class="card-column">
                    <div class="card-item highlight"></div>
                    <div class="card-item"></div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
